name: CI — Build and push to ECR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

jobs:
  build-and-push:
    name: Build and push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - job-service
          - candidate-service
          - rag-service
          - notification-service
          - frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: vars
        run: echo "IMAGE_TAG=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          if [ "${{ matrix.service }}" = "frontend" ]; then
            docker build \
              -f apps/frontend/Dockerfile \
              -t $ECR_REGISTRY/intellihire-${{ matrix.service }}:${{ steps.vars.outputs.IMAGE_TAG }} \
              -t $ECR_REGISTRY/intellihire-${{ matrix.service }}:latest \
              apps/frontend
          else
            docker build \
              -f apps/${{ matrix.service }}/Dockerfile \
              -t $ECR_REGISTRY/intellihire-${{ matrix.service }}:${{ steps.vars.outputs.IMAGE_TAG }} \
              -t $ECR_REGISTRY/intellihire-${{ matrix.service }}:latest \
              .
          fi

      - name: Push to ECR
        run: |
          docker push $ECR_REGISTRY/intellihire-${{ matrix.service }}:${{ steps.vars.outputs.IMAGE_TAG }}
          docker push $ECR_REGISTRY/intellihire-${{ matrix.service }}:latest

      - name: Output image URI
        run: |
          echo "✅ Pushed: $ECR_REGISTRY/intellihire-${{ matrix.service }}:${{ steps.vars.outputs.IMAGE_TAG }}"